name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Mondays 08:00 UTC — weekly scale + chaos sweep
    - cron: "0 8 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12"]
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type check (mypy strict)
        run: mypy src

      - name: Unit + E2E + schema tests (with coverage)
        run: pytest -m "not scale and not chaos" --cov=aigovops_lantern --cov-report=term-missing --cov-fail-under=80

      - name: Smoke test CLI
        run: |
          lantern --version
          lantern read tests/fixtures/bundle_signed.ndjson
          lantern diff tests/fixtures/bundle_old.ndjson tests/fixtures/bundle_new.ndjson
          lantern explain UCID-DATA-BIAS-001

  nightly-scale-chaos:
    name: Nightly scale + chaos
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Scale tests
        env:
          RUN_SCALE: "1"
        run: pytest -m scale -v

      - name: Chaos tests (Hypothesis fuzz + I/O failure injection)
        env:
          RUN_CHAOS: "1"
        run: pytest -m chaos -v
