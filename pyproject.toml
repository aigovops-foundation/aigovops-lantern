[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "aigovops-lantern"
version = "0.1.0a1"
description = "AIGovOps Lantern™ — the human-carried companion to AIGovOps Beacon. Beacon signs. Lantern reads."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "AIGovOps Foundation", email = "trademark@aigovopsfoundation.org" },
]
keywords = [
    "ai-governance",
    "compliance",
    "policy-as-code",
    "conformance",
    "umbrella-govops",
    "aigovops",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
lantern = "aigovops_lantern.cli:app"

[project.urls]
Homepage = "https://github.com/bobrapp/aigovops-lantern"
Documentation = "https://github.com/bobrapp/aigovops-lantern/blob/main/README.md"
Source = "https://github.com/bobrapp/aigovops-lantern"
Issues = "https://github.com/bobrapp/aigovops-lantern/issues"
"Companion: Beacon" = "https://github.com/bobrapp/aigovops-beacon"
"Companion: Umbrella" = "https://github.com/bobrapp/umbrella-govops"

[tool.hatch.build.targets.wheel]
packages = ["src/aigovops_lantern"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "C90", "N", "SIM"]
ignore = ["E501"]  # rich format strings

[tool.ruff.lint.mccabe]
# Rendering functions are naturally branchy (one branch per role / format / category).
max-complexity = 20

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
